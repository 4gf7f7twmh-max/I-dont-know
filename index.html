<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kochatlas</title>
<meta name="description" content="Kochbuch-App mit über 4500 Rezepten, animierten Schritt-für-Schritt-Anleitungen für jedes Küchengerät, Sterneküche mit Anrichte-Plänen und geteilter Einkaufsliste.">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochatlas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/scenes.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a href="#start" class="logo" id="logo" aria-label="Kochatlas Startseite"></a>
    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
    <div class="top-actions">
      <a class="icon-btn" id="searchbtn" href="#entdecken" aria-label="Suchen"></a>
      <button class="icon-btn" id="themebtn" data-act="theme" aria-label="Hell/Dunkel umschalten"></button>
    </div>
  </div>
</header>
<main id="view"></main>
<div class="cook" id="cook" hidden role="dialog" aria-label="Kochmodus"></div>
<div class="timers" id="timers" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="js/devices.js"></script>
<script src="js/icons.js"></script>
<script src="js/animations.js"></script>
<script src="js/plating.js"></script>

<script src="data/02-suppen.js"></script>
<script src="data/03-pasta.js"></script>
<script src="data/04-fleisch.js"></script>
<script src="data/05-fisch.js"></script>
<script src="data/06-veggie.js"></script>
<script src="data/07-beilagen-salate.js"></script>
<script src="data/08-snacks.js"></script>
<script src="data/09-kuchen.js"></script>
<script src="data/10-brot.js"></script>
<script src="data/11-dessert.js"></script>
<script src="data/12-kreationen.js"></script>
<script src="data/13-sterne.js"></script>
<script src="data/14-schnell.js"></script>

<script src="data/16-sterne-2.js"></script>
<script src="data/images.js"></script>
<script src="data/web/index.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
