<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kochatlas</title>
<meta name="description" content="Kochbuch-App mit Schritt-für-Schritt-Anleitungen und Animationen für Herd, Backofen, Heißluftfritteuse, Thermomix, Mikrowelle, Schnellkochtopf, Slow Cooker und Grill.">
<meta name="theme-color" content="#ef4f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochatlas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a href="#/" class="logo" id="logo" aria-label="Kochatlas Startseite"></a>
    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
    <div class="top-actions">
      <a class="icon-btn" id="searchbtn" href="#/entdecken" aria-label="Suchen"></a>
      <button class="icon-btn" id="themebtn" data-act="theme" aria-label="Hell/Dunkel umschalten"></button>

<main id="view"></main>

<div class="timers" id="timers" aria-live="polite"></div>

<script src="data/06-veggie.js"></script>

<script src="data/09-kuchen.js"></script>
<script src="data/10-brot.js"></script>
